<!DOCTYPE html>
<html>
<head>
  <title>Industrial AI Assistant</title>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:#0f172a;
      color:white;
    }

    header{
      background:#111827;
      padding:15px;
      text-align:center;
      font-size:24px;
      font-weight:bold;
    }

    #chat{
      height:65vh;
      overflow-y:auto;
      padding:15px;
    }

    .msg{
      margin:10px;
      padding:12px;
      border-radius:12px;
      max-width:80%;
      line-height:1.4;
    }

    .user{
      background:#2563eb;
      margin-left:auto;
    }

    .ai{
      background:#374151;
      margin-right:auto;
    }

    #controls{
      position:fixed;
      bottom:0;
      width:100%;
      background:#111827;
      padding:10px;
      text-align:center;
    }

    button{
      padding:12px 20px;
      border:none;
      border-radius:10px;
      font-size:16px;
      cursor:pointer;
      background:#2563eb;
      color:white;
    }

    input[type=file]{
      color:white;
      margin-top:10px;
    }

    #preview{
      max-width:150px;
      border-radius:10px;
      margin-top:10px;
      display:none;
    }

    #status{
      margin-top:8px;
      color:#9ca3af;
      font-size:14px;
    }

    #avatar{
      font-size:55px;
      margin-top:10px;
    }
  </style>
</head>

<body>

<header>
  Industrial AI Assistant
</header>

<div id="chat"></div>

<div id="controls">

  <button onclick="startAssistant()">🎤 Start Assistant</button>

  <br>

  <input type="file" id="imageInput" accept="image/*">

  <br>

  <img id="preview">

  <div id="status">Idle</div>

  <div id="avatar">🙂</div>

</div>

<script>

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const recognition = new SpeechRecognition();

recognition.lang = "en-US";
recognition.continuous = false;
recognition.interimResults = false;

let active = false;
let imageUploaded = false;
let mode = "general";
let step = 0;

// ================= UI =================

function addMessage(text,type){

  let div = document.createElement("div");

  div.className = "msg " + type;

  div.innerText = text;

  document.getElementById("chat").appendChild(div);

  document.getElementById("chat").scrollTop =
  document.getElementById("chat").scrollHeight;
}

function setStatus(text){
  document.getElementById("status").innerText = text;
}

function avatar(talk){
  document.getElementById("avatar").innerText =
  talk ? "🗣️" : "🙂";
}

// ================= START =================

function startAssistant(){

  active = true;

  speak(
    "Hello. Industrial assistant activated. Please describe your generator or ATS problem."
  );
}

// ================= SPEAK =================

function speak(text){

  avatar(true);

  let msg = new SpeechSynthesisUtterance(text);

  msg.rate = 1;
  msg.pitch = 1;

  msg.onend = function(){

    avatar(false);

    if(active){
      listen();
    }
  };

  speechSynthesis.speak(msg);
}

// ================= LISTEN =================

function listen(){

  if(!active) return;

  setStatus("Listening...");

  try{
    recognition.start();
  }catch(e){
    setTimeout(listen,1000);
  }
}

// ================= VOICE INPUT =================

recognition.onresult = function(event){

  let text = event.results[0][0].transcript.toLowerCase();

  addMessage(text,"user");

  setStatus("Thinking...");

  let reply = brain(text);

  addMessage(reply,"ai");

  speak(reply);
};

recognition.onerror = function(){
  setTimeout(listen,1200);
};

recognition.onend = function(){

  if(active){
    setTimeout(listen,800);
  }
};

// ================= IMAGE =================

document.getElementById("imageInput").onchange = function(e){

  let file = e.target.files[0];

  if(file){

    imageUploaded = true;

    let reader = new FileReader();

    reader.onload = function(){

      let img = document.getElementById("preview");

      img.src = reader.result;

      img.style.display = "block";
    };

    reader.readAsDataURL(file);

    addMessage("Image uploaded","user");

    speak(
      "Image received. Please describe the issue."
    );
  }
};

// ================= AI LOGIC =================

function brain(t){

  // END
  if(match(t,[
    "thank you",
    "bye",
    "disconnect",
    "end"
  ])){

    active = false;

    return "Conversation ended. Goodbye.";
  }

  // START ISSUE
  if(match(t,[
    "not starting",
    "fails to start",
    "cannot start",
    "won't start"
  ])){

    mode = "start_issue";
    step = 1;

    return "Generator not starting. Is battery voltage above 12 point 5 volts?";
  }

  // FLOW
  if(mode === "start_issue"){

    if(step === 1){

      if(isYes(t)){
        step = 2;
        return "Do you hear starter relay clicking?";
      }else{
        mode = "general";
        return "Battery problem detected. Charge or replace battery.";
      }
    }

    if(step === 2){

      if(isYes(t)){
        step = 3;
        return "Is fuel reaching the engine properly?";
      }else{
        mode = "general";
        return "Starter relay or ATS signal fault.";
      }
    }

    if(step === 3){

      mode = "general";

      if(isYes(t)){
        return "Possible starter motor or control board fault.";
      }else{
        return "Fuel blockage or fuel solenoid problem.";
      }
    }
  }

  // ATS
  if(t.includes("ats")){

    return "Check ATS contactor, sensing voltage, control fuse and relay.";
  }

  // OVERLOAD
  if(t.includes("overload")){

    return "Reduce electrical load and verify generator capacity.";
  }

  // IMAGE CONTEXT
  if(imageUploaded){

    if(match(t,[
      "burn",
      "smoke",
      "black"
    ])){

      return "Possible overheating or burnt wiring. Inspect insulation and terminals.";
    }

    if(match(t,[
      "oil",
      "fuel leak",
      "leak"
    ])){

      return "Possible oil or fuel leak. Check pipes, seals and tank connections.";
    }
  }

  // SHORT REPLY
  if(t.length < 4){

    return "Please describe the issue more clearly.";
  }

  // DEFAULT
  return "Describe symptoms like sound, voltage, smell or machine behavior for better diagnosis.";
}

// ================= HELPERS =================

function match(text,arr){
  return arr.some(x => text.includes(x));
}

function isYes(t){

  return [
    "yes",
    "yeah",
    "correct",
    "working",
    "ok",
    "right",
    "fine"
  ].some(x => t.includes(x));
}

</script>

</body>
</html>
