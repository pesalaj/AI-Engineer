<!DOCTYPE html>
<html>
<head>
  <title>Industrial AI Diagnostic Assistant</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial;
    }

    body{
      background:#0b1120;
      color:white;
      height:100vh;
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }

    header{
      background:#111827;
      padding:18px;
      text-align:center;
      font-size:24px;
      border-bottom:1px solid #1f2937;
      letter-spacing:1px;
    }

    #main{
      flex:1;
      display:flex;
      overflow:hidden;
    }

    /* SIDEBAR */

    #sidebar{
      width:250px;
      background:#111827;
      border-right:1px solid #1f2937;
      padding:20px;
      overflow:auto;
    }

    .tab{
      background:#1f2937;
      padding:14px;
      margin-bottom:12px;
      border-radius:10px;
      border:1px solid #374151;
    }

    /* CONTENT */

    #content{
      flex:1;
      padding:20px;
      overflow:auto;
    }

    .panel{
      background:#111827;
      border:1px solid #1f2937;
      border-radius:15px;
      padding:20px;
      margin-bottom:20px;
    }

    h3{
      margin-bottom:15px;
      color:#60a5fa;
      font-weight:normal;
    }

    button{
      background:#2563eb;
      color:white;
      border:none;
      padding:12px 22px;
      border-radius:10px;
      font-size:16px;
      cursor:pointer;
    }

    button:hover{
      background:#1d4ed8;
    }

    #chat{
      height:430px;
      overflow-y:auto;
      background:#0f172a;
      border-radius:10px;
      padding:15px;
      border:1px solid #1f2937;
    }

    .msg{
      padding:12px;
      margin-bottom:12px;
      border-radius:10px;
      line-height:1.6;
      max-width:85%;
    }

    .user{
      background:#2563eb;
      margin-left:auto;
      text-align:right;
    }

    .ai{
      background:#374151;
      margin-right:auto;
    }

    input[type=file]{
      margin-top:15px;
      color:white;
    }

    #preview{
      margin-top:15px;
      max-width:220px;
      border-radius:10px;
      display:none;
      border:1px solid #374151;
    }

    #status{
      margin-top:15px;
      color:#9ca3af;
    }

    .info{
      margin-top:15px;
      background:#0f172a;
      padding:15px;
      border-radius:10px;
      border:1px solid #1f2937;
      color:#cbd5e1;
      line-height:1.7;
    }

  </style>
</head>

<body>

<header>
  Industrial AI Diagnostic Assistant
</header>

<div id="main">

  <!-- SIDEBAR -->

  <div id="sidebar">

    <div class="tab">Dashboard</div>
    <div class="tab">Voice Assistant</div>
    <div class="tab">Generators</div>
    <div class="tab">ATS Systems</div>
    <div class="tab">Motors</div>
    <div class="tab">Compressors</div>
    <div class="tab">Pumps</div>
    <div class="tab">HVAC</div>
    <div class="tab">Electrical Systems</div>

  </div>

  <!-- CONTENT -->

  <div id="content">

    <!-- VOICE -->

    <div class="panel">

      <h3>Voice Control</h3>

      <button onclick="startAssistant()">
        Start Assistant
      </button>

      <div id="status">
        Status: Idle
      </div>

      <div class="info">
        Continuous industrial diagnostic discussion enabled.
      </div>

    </div>

    <!-- IMAGE -->

    <div class="panel">

      <h3>Equipment Image</h3>

      <input type="file" id="imageInput" accept="image/*">

      <br>

      <img id="preview">

    </div>

    <!-- CHAT -->

    <div class="panel">

      <h3>Diagnostic Conversation</h3>

      <div id="chat"></div>

    </div>

  </div>

</div>

<script>

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

const recognition = new SpeechRecognition();

recognition.lang = "en-US";
recognition.continuous = false;
recognition.interimResults = false;

// ================= VARIABLES =================

let active = false;
let listening = false;

let imageUploaded = false;

let currentEquipment = "";
let currentFault = "";

let lastQuestion = "";

let diagnosisComplete = false;

let probableIssue = "";
let estimatedCost = "";

let memory = [];

// ================= UI =================

function addMessage(text,type){

  let div = document.createElement("div");

  div.className = "msg " + type;

  div.innerText = text;

  document.getElementById("chat")
  .appendChild(div);

  document.getElementById("chat")
  .scrollTop =
  document.getElementById("chat")
  .scrollHeight;
}

function setStatus(t){

  document.getElementById("status")
  .innerText = "Status: " + t;
}

// ================= START =================

function startAssistant(){

  if(active) return;

  active = true;

  addMessage(
    "Industrial assistant activated.",
    "ai"
  );

  speak(
    "Industrial assistant activated. Please describe the equipment problem."
  );
}

// ================= SPEAK =================

function speak(text){

  speechSynthesis.cancel();

  setStatus("Speaking");

  let msg = new SpeechSynthesisUtterance(text);

  msg.rate = 1;

  msg.onend = function(){

    if(active){

      setTimeout(()=>{
        listen();
      },400);
    }
  };

  speechSynthesis.speak(msg);
}

// ================= LISTEN =================

function listen(){

  if(!active) return;

  if(listening) return;

  listening = true;

  setStatus("Listening");

  try{

    recognition.start();

  }catch(e){

    listening = false;

    setTimeout(listen,1000);
  }
}

// ================= RECOGNITION =================

recognition.onresult = function(event){

  listening = false;

  let text =
  event.results[0][0]
  .transcript
  .toLowerCase();

  addMessage(text,"user");

  memory.push(text);

  let reply = brain(text);

  addMessage(reply,"ai");

  speak(reply);
};

recognition.onerror = function(){

  listening = false;

  if(active){

    setTimeout(listen,1000);
  }
};

recognition.onend = function(){

  listening = false;
};

// ================= IMAGE =================

document.getElementById("imageInput")
.onchange = function(e){

  let file = e.target.files[0];

  if(file){

    imageUploaded = true;

    let reader = new FileReader();

    reader.onload = function(){

      let img =
      document.getElementById("preview");

      img.src = reader.result;

      img.style.display = "block";
    };

    reader.readAsDataURL(file);

    addMessage(
      "Equipment image uploaded.",
      "user"
    );

    speak(
      "Image received successfully. Please describe the visible problem."
    );
  }
};

// ================= AI ENGINE =================

function brain(t){

  detectEquipment(t);

  // ================= END =================

  if(match(t,[
    "bye",
    "disconnect",
    "end",
    "thank you",
    "thats all"
  ])){

    active = false;

    return "Session completed. Industrial assistant disconnected.";
  }

  // ================= AFTER DIAGNOSIS QUESTIONS =================

  if(diagnosisComplete){

    if(match(t,[
      "repair",
      "fix",
      "how to repair"
    ])){

      return "Recommended repair: " +
      probableIssue +
      ". Ensure qualified technician inspection before replacing parts.";
    }

    if(match(t,[
      "cost",
      "price",
      "estimate"
    ])){

      return "Estimated repair cost for " +
      probableIssue +
      " is approximately " +
      estimatedCost +
      " depending on parts and labour.";
    }

    if(match(t,[
      "where",
      "service",
      "repair shop",
      "technician"
    ])){

      return "Recommended: contact generator, motor or industrial electrical service center near your location. Prefer authorized repair centers for controller or ATS issues.";
    }

    if(match(t,[
      "why",
      "reason",
      "cause"
    ])){

      return "Likely causes include overload, aging components, loose wiring, overheating, insufficient maintenance or unstable supply conditions.";
    }
  }

  // ================= FOLLOW-UP =================

  if(lastQuestion === "voltage"){

    if(isYes(t)){

      lastQuestion = "relay";

      return "Understood. Do you hear relay or starter clicking?";
    }
    else{

      finishDiagnosis(
        "Power supply or battery failure",
        "$50 to $250"
      );

      return diagnosisResult();
    }
  }

  if(lastQuestion === "relay"){

    if(isYes(t)){

      lastQuestion = "fuel";

      return "Good. Is fuel, air or operating medium reaching correctly?";
    }
    else{

      finishDiagnosis(
        "Starter relay or contactor failure",
        "$80 to $350"
      );

      return diagnosisResult();
    }
  }

  if(lastQuestion === "fuel"){

    if(isYes(t)){

      finishDiagnosis(
        "Starter motor, ECU or control board issue",
        "$200 to $1200"
      );

      return diagnosisResult();
    }
    else{

      finishDiagnosis(
        "Fuel blockage or supply interruption",
        "$50 to $300"
      );

      return diagnosisResult();
    }
  }

  // ================= START ISSUE =================

  if(match(t,[
    "not starting",
    "cannot start",
    "fails to start",
    "wont start"
  ])){

    diagnosisComplete = false;

    currentFault = "start";

    lastQuestion = "voltage";

    return "Understood. " +
    (currentEquipment || "Equipment") +
    " is not starting. Is supply voltage or battery condition normal?";
  }

  // ================= OVERHEAT =================

  if(match(t,[
    "overheat",
    "high temperature",
    "too hot"
  ])){

    finishDiagnosis(
      "Cooling or overload problem",
      "$100 to $800"
    );

    return diagnosisResult();
  }

  // ================= NOISE =================

  if(match(t,[
    "noise",
    "vibration",
    "knocking"
  ])){

    finishDiagnosis(
      "Bearing wear or mechanical imbalance",
      "$150 to $900"
    );

    return diagnosisResult();
  }

  // ================= NO POWER =================

  if(match(t,[
    "no power",
    "no voltage",
    "no output"
  ])){

    finishDiagnosis(
      "Breaker, AVR or protection system fault",
      "$120 to $1000"
    );

    return diagnosisResult();
  }

  // ================= TRIPPING =================

  if(match(t,[
    "trip",
    "tripping"
  ])){

    finishDiagnosis(
      "Overload or short circuit condition",
      "$100 to $700"
    );

    return diagnosisResult();
  }

  // ================= IMAGE =================

  if(imageUploaded){

    if(match(t,[
      "burn",
      "smoke",
      "black"
    ])){

      finishDiagnosis(
        "Burnt wiring or overheating damage",
        "$80 to $600"
      );

      return diagnosisResult();
    }

    if(match(t,[
      "leak",
      "oil",
      "fuel leak"
    ])){

      finishDiagnosis(
        "Seal, hose or pipe leakage",
        "$40 to $400"
      );

      return diagnosisResult();
    }
  }

  // ================= EQUIPMENT QUESTIONS =================

  if(match(t,[
    "how does it work",
    "working principle",
    "explain"
  ])){

    return "The " +
    (currentEquipment || "equipment") +
    " operates using electrical, mechanical and control systems working together. Please specify which section you want explained.";
  }

  // ================= DEFAULT =================

  return "Continue describing the issue or ask about repair methods, causes, estimated costs or operation details.";
}

// ================= FINAL DIAGNOSIS =================

function finishDiagnosis(issue,cost){

  diagnosisComplete = true;

  probableIssue = issue;

  estimatedCost = cost;

  lastQuestion = "";
}

function diagnosisResult(){

  return "Probable diagnosis: " +
  probableIssue +
  ". Estimated repair cost: " +
  estimatedCost +
  ". You may ask for repair method, causes, technician advice or further technical explanation.";
}

// ================= EQUIPMENT DETECTION =================

function detectEquipment(t){

  if(match(t,["generator","genset"])){
    currentEquipment = "generator";
  }

  if(match(t,["ats","transfer switch"])){
    currentEquipment = "ats";
  }

  if(match(t,["motor"])){
    currentEquipment = "motor";
  }

  if(match(t,["compressor"])){
    currentEquipment = "compressor";
  }

  if(match(t,["pump"])){
    currentEquipment = "pump";
  }

  if(match(t,["ac","hvac","air conditioner"])){
    currentEquipment = "ac";
  }
}

// ================= HELPERS =================

function match(text,arr){

  return arr.some(
    x => text.includes(x)
  );
}

function isYes(t){

  return [
    "yes",
    "correct",
    "ok",
    "working",
    "normal",
    "right",
    "fine",
    "good"
  ].some(x => t.includes(x));
}

</script>

</body>
</html>
